[package]
name = "bwrap-web"
version = "0.1.0"
edition = "2021"
description = "Minimal local web UI for configuring and launching a bubblewrap sandbox around OpenCode"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
strip = true
